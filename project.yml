name: MoodCal
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant, ja, ko, de, es, fr, pt-BR, it, nl]
settings:
  base:
    APP_ID: com.hgsldswk.moodcal
    APP_STORE_ID: "6837368602"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  MoodCal:
    type: application
    platform: iOS
    sources: [MoodCal, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: MoodCal AppStore
    info:
      path: MoodCal/Info.plist
      properties:
        CFBundleDisplayName: 心情日历
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.moodcal.backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [moodbackup]
          - UTTypeIdentifier: com.hgsldswk.moodcal.palette
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [moodpalette]
  MoodCalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MoodCalTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  MoodCalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MoodCalUITests]
    dependencies:
      - target: MoodCal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MoodCal
schemes:
  MoodCal:
    build:
      targets:
        MoodCal: all
        MoodCalTests: [test]
    test:
      config: Debug
      targets: [MoodCalTests]
  MoodCalUI:
    build:
      targets:
        MoodCal: all
        MoodCalUITests: [test]
    test:
      config: Debug
      targets: [MoodCalUITests]
